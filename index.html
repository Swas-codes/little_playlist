<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>the little mixtape</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="intro">
    <h1>Somwhere Between</h1>
    <p>Some melodies,some stories,one little playlist.</p>
    <script src="script.js"></script>
    </section>

    <section class="songs">

    <div class="song">
    <span class="number">01</span>
    <div class="song-info">
    <h2>Iris - Go Go Dolls</h2>
    </div>
    <button class="play-btn">▶</button>
    </div>  

    <div class="song">
    <span class="number">02</span>
    <div class="song-info">
    <h2>Song Name</h2>
    </div>
    <button class="play-btn">▶</button>
    </div>

    <div class="song">
    <span class="number">03</span>
    <div class="song-info">
    <h2>Song Name</h2>
    </div>
    <button class="play-btn">▶</button>
    </div>

    <div class="song">
    <span class="number">04</span>
    <div class="song-info">
    <h2>Song Name</h2>
    </div>
    <button class="play-btn">▶</button>
    </div>

    <div class="song">
    <span class="number">05</span>
    <div class="song-info">
    <h2>Song Name</h2>
    </div>
    <button class="play-btn">▶</button>
    </div>

    </section>

    <section class="player">
    <span>now playing</span>
    <h2 id="current-song">—</h2>
    <audio id="audio-player"></audio>
    <div class="controls">
    <button id="previous">←</button>
    <button id="play">▶</button>
    <button id="next">→</button>
    </div>
    <audio id="audio-player" controls></audio>

    </section>

    <footer>
    <p>✦ press play & let it unfold ✦</p>
    </footer>

</body>
</html>
